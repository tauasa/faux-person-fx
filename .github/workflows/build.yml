name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Maven's downloads are kept between runs, keyed on pom.xml and the month. When
      # pom.xml changes, as every version bump does, the restore key starts from main's
      # last copy, so Maven fetches only what's new and Central doesn't throttle us
      # (HTTP 429). A new month starts a fresh copy from Central, so nothing in it lasts
      # past the month.
      - name: Cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ steps.month.outputs.month }}-
      # The JavaFX tests (table, window, About, splash) start the toolkit, which needs a display and GTK.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64
      - run: xvfb-run -a mvn -B verify
