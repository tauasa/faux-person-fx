spring.application.name=faux-person-fx
spring.main.banner-mode=off
spring.main.web-application-type=none

# The count the window opens with, and the most one Generate may make.
faux.fx.default-count=100
faux.fx.max-count=10000

# Where each tab's seed history is kept between sessions. ~/ is the home
# folder. Leave it empty to keep no history on disk.
faux.fx.history-file=~/.faux-person-fx/seed-history.txt

# Where the Help > Appearance choice (Light, Dark or System) is kept between
# sessions. Leave it empty to start in System every time. The splash screen
# shows before this file is read, so it reads -Dfaux.fx.appearance-file, or
# this default.
faux.fx.appearance-file=~/.faux-person-fx/appearance.txt

# Filled in by Maven at build time, for Help > About.
faux.fx.version=@project.version@
faux.fx.faux-person-version=@faux-person.version@
